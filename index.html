<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credencial Digital - DevGenn</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Contenedor principal para centrar la tarjeta con Flexbox -->
    <main class="credencial-container">
        <div class="credencial-tarjeta">
            <div class="insignia">TOP STUDENT</div>
            
            <!-- 1. Encabezado -->
            <header class="credencial-header">
                <div class="avatar-container">
                    <!-- Aquí irá tu foto o avatar -->
                    <img src="https://media.licdn.com/dms/image/v2/D4E03AQFPhX-Vc0Q3vw/profile-displayphoto-scale_400_400/B4EZwKZ0yLKoAg-/0/1769701069175?e=1793232000&v=beta&t=4t01LLoD2sujcWpBKLR6unHkHK3o21FxEzJir2qTxvI" alt="Avatar de la credencial" class="avatar">
                </div>
                <h1>Miguel Quintero</h1>
                <p class="rol">Full Stack Developer</p>
            </header>

            <!-- 2. Información -->
            <section class="credencial-info">
                <p><i class="fa-solid fa-city"></i> Ciudad: Bogotá</p>
                <p><i class="fa-solid fa-envelope"></i> Correo: peru@.com</p>
                <p><i class="fa-solid fa-code"></i> Tecnología favorita: JavaScript</p>
                <p><i class="fa-solid fa-gamepad"></i> Hobby: Videojuegos,musica</p>
                <p><strong>GitHub:</strong> github.com/MiguelQuintero21</p>
                <p class="frase">"El código limpio siempre parece escrito por alguien que se preocupa."</p>
            </section>

            <!-- 3. Pie -->
            <footer class="credencial-footer">
                <span>ID: 004578X3</span>
                
                <span>Valid from: 2026/10</span>
            </footer>

        </div>
    </main>

</body>
</html>
